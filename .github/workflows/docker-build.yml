name: CD – Build & Push Docker Images

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ems

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: gateway
            context: ./gateway
            image: ems-gateway
          - service: auth-service
            context: ./services/auth-service
            image: ems-auth-service
          - service: event-service
            context: ./services/event-service
            image: ems-event-service
          - service: booking-service
            context: ./services/booking-service
            image: ems-booking-service
          - service: review-service
            context: ./services/review-service
            image: ems-review-service
          - service: checkin-service
            context: ./services/checkin-service
            image: ems-checkin-service
          - service: notification-service
            context: ./services/notification-service
            image: ems-notification-service
          - service: analytics-service
            context: ./services/analytics-service
            image: ems-analytics-service
          - service: frontend
            context: ./frontend
            image: ems-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
