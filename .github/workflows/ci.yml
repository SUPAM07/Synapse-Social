name: CI – Test & Lint

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  validate-services:
    name: Validate Service Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway
          - services/auth-service
          - services/event-service
          - services/booking-service
          - services/review-service
          - services/checkin-service
          - services/notification-service
          - services/analytics-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate package.json
        run: node -e "const p = JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('✅', p.name, p.version)"
