version: '3.9'

services:
  # ── Infrastructure ────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ems-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo ruok | nc localhost 2181']
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ems-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'localhost:9092']
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    container_name: ems-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: ems-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ems_bookings
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: ems-redis
    ports:
      - '6379:6379'
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Gateway ───────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: ems-gateway
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      REDIS_URL: redis://redis:6379
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      AUTH_SERVICE_URL: http://auth-service:3001
      EVENT_SERVICE_URL: http://event-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3003
      REVIEW_SERVICE_URL: http://review-service:3004
      CHECKIN_SERVICE_URL: http://checkin-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      ANALYTICS_SERVICE_URL: http://analytics-service:3007
    depends_on:
      - auth-service
      - event-service
      - booking-service
      - review-service
      - checkin-service
      - notification-service
      - analytics-service
      - redis
    restart: unless-stopped

  # ── Microservices ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/services/auth-service
      dockerfile: Dockerfile
    container_name: ems-auth-service
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/ems_auth
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  event-service:
    build:
      context: ./backend/services/event-service
      dockerfile: Dockerfile
    container_name: ems-event-service
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongo:27017/ems_events
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_DLQ_TOPIC: event-service.dlq
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build:
      context: ./backend/services/booking-service
      dockerfile: Dockerfile
    container_name: ems-booking-service
    ports:
      - '3003:3003'
    environment:
      PORT: 3003
      POSTGRES_URI: postgresql://postgres:postgres@postgres:5432/ems_bookings
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_DLQ_TOPIC: booking-service.dlq
      EVENT_SERVICE_URL: http://event-service:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  review-service:
    build:
      context: ./backend/services/review-service
      dockerfile: Dockerfile
    container_name: ems-review-service
    ports:
      - '3004:3004'
    environment:
      PORT: 3004
      MONGO_URI: mongodb://mongo:27017/ems_reviews
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      KAFKA_BROKERS: kafka:29092
      KAFKA_DLQ_TOPIC: review-service.dlq
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  checkin-service:
    build:
      context: ./backend/services/checkin-service
      dockerfile: Dockerfile
    container_name: ems-checkin-service
    ports:
      - '3005:3005'
    environment:
      PORT: 3005
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_DLQ_TOPIC: checkin-service.dlq
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend/services/notification-service
      dockerfile: Dockerfile
    container_name: ems-notification-service
    ports:
      - '3006:3006'
    environment:
      PORT: 3006
      KAFKA_BROKERS: kafka:29092
      KAFKA_DLQ_TOPIC: notification-service.dlq
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@ems.local}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: ./backend/services/analytics-service
      dockerfile: Dockerfile
    container_name: ems-analytics-service
    ports:
      - '3007:3007'
    environment:
      PORT: 3007
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_DLQ_TOPIC: analytics-service.dlq
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: ems-frontend
    ports:
      - '5173:80'
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  mongo-data:
  postgres-data:
  redis-data:
