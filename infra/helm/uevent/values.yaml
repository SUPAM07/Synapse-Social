global:
  namespace: uevent
  imageRegistry: ""
  imagePullPolicy: IfNotPresent

kafka:
  image:
    repository: confluentinc/cp-kafka
    tag: "7.5.0"
  replicas: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  storage: 10Gi

apiGateway:
  image:
    repository: uevent/api-gateway
    tag: latest
  replicas: 2
  port: 3000
  service:
    type: LoadBalancer
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  env:
    RATE_LIMIT_WINDOW_MS: "900000"
    RATE_LIMIT_MAX: "100"

authService:
  image:
    repository: uevent/auth-service
    tag: latest
  replicas: 2
  port: 3001
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    JWT_ACCESS_EXPIRY: "15m"
    JWT_REFRESH_EXPIRY: "7d"

userService:
  image:
    repository: uevent/user-service
    tag: latest
  replicas: 2
  port: 3002
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

eventService:
  image:
    repository: uevent/event-service
    tag: latest
  replicas: 2
  port: 3003
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

bookingService:
  image:
    repository: uevent/booking-service
    tag: latest
  replicas: 2
  port: 3004
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

paymentService:
  image:
    repository: uevent/payment-service
    tag: latest
  replicas: 2
  port: 3005
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

notificationService:
  image:
    repository: uevent/notification-service
    tag: latest
  replicas: 1
  port: 3006
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
